name: Assignment checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:e2e --list

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Credential rejection cases (PR or non-main dispatch)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: bun test -t 'API-TEST-0[45]'
      - name: Full API suite (trusted main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
        run: |
          if [[ -z "$PH_API_TOKEN" ]]; then
            echo "::error::Configure PH_API_TOKEN for authenticated API tests."
            exit 1
          fi
          bun run test:api --bail

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun --bun x playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            test-results/access-preflight.json
            test-results/**/test-failed-*.png
          retention-days: 3
          if-no-files-found: warn
